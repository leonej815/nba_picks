name: Daily Web Scraper

on:
  schedule:
    # This runs at 8:00 AM UTC (1:00 AM Eastern Time), every day, from October through April
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Caches pip dependencies between runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Scraper
        run: python nba_screener/nba_screener.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add sqlite/data.sqlite
          git add csv/data.csv
          # The "|| exit 0" prevents the action from failing if no data changed
          git commit -m "Automated data update" || exit 0
          git push